trigger:
- master   # change to main if your branch is main

pool:
  vmImage: 'windows-latest'

variables:
  buildConfiguration: 'Release'
  publishDir: '$(Build.ArtifactStagingDirectory)/publish'

steps:
- task: UseDotNet@2
  inputs:
    packageType: 'sdk'
    version: '8.x'

# Restore
- script: dotnet restore
  displayName: 'Restore NuGet Packages'

# Build
- script: dotnet build -c $(buildConfiguration) --no-restore
  displayName: 'Build'

# Test
- script: dotnet test --no-build
  displayName: 'Run Tests'

# 🔑 Publish Web API (IMPORTANT)
- script: |
    dotnet publish InventoryAPI.csproj `
      -c $(buildConfiguration) `
      -o $(publishDir)
  displayName: 'Publish Web API'

# Artifact (optional but good)
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: '$(publishDir)'
    artifactName: 'drop'

# 🚀 Deploy to Azure App Service
- task: AzureWebApp@1
  displayName: 'Deploy to Azure'
  inputs:
    azureSubscription: 'AzureServiceConnection'
    appName: 'inventoryapiseema-hmfbfce0eshcgaey'   # EXACT App Service name
    package: '$(publishDir)'
