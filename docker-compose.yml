version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_strong_P@ssw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql

  inventoryapi:
    build:
      context: ./InventoryAPI
      dockerfile: Dockerfile
    depends_on:
      - sqlserver
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=UtensilsInventory;User Id=sa;Password=Your_strong_P@ssw0rd;TrustServerCertificate=True;
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=InventoryAPI
      - Jwt__Audience=InventoryClient
    ports:
      - "5000:80"

volumes:
  sqlvolume:
